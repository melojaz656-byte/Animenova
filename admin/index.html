<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeNova — Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07060d;color:#f7f5fb;font-family:Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 10%,#5720a822,transparent 35%),radial-gradient(circle at 10% 90%,#00cfff0b,transparent 30%)}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-weight:900;font-size:24px}.brand b{color:#a765ff}.muted{color:#9893a7}.btn{border:1px solid #302b42;background:#12101b;color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#9d55ff,#d12cff)}.btn.danger{border-color:#6d263d;color:#ff9bb5}.grid{display:grid;grid-template-columns:260px 1fr;gap:20px}.side,.card{background:#100e18dd;border:1px solid #29243a;border-radius:18px}.side{padding:14px;height:max-content}.tab{width:100%;text-align:left;background:transparent;border:0;color:#aaa5b7;padding:13px;border-radius:10px;cursor:pointer}.tab.active,.tab:hover{background:#211735;color:#fff}.card{padding:22px;margin-bottom:18px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{font-size:12px;color:#aaa5b7;display:block;margin:0 0 7px}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #302b42;background:#0b0a11;color:#fff;outline:none}textarea{min-height:100px;resize:vertical}.check{display:flex;gap:8px;align-items:center;color:#aaa5b7;font-size:13px}.check input{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:10px}.item{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid #29243a;border-radius:12px;background:#0d0c14}.poster{width:55px;height:70px;object-fit:cover;border-radius:8px;background:#211b30}.grow{flex:1}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#211735;color:#c69bff;font-size:11px}.hidden{display:none}.login{max-width:430px;margin:12vh auto}.msg{padding:11px;border-radius:10px;background:#211735;color:#d7c6ff;margin:10px 0}.error{background:#3a1725;color:#ffb1c5}@media(max-width:800px){.grid{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}.wrap{padding:15px}}
</style></head><body><div id="app"></div>
<script>
const SB_URL='https://ztrvntjjunkmaatuqngn.supabase.co';
const SB_KEY='sb_publishable_WM62SrNqdOsf8hbgx4U1hA_7tSOFvfs';
const db=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app'); let session=null,anime=[],seasons=[],episodes=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function boot(){const r=await db.auth.getSession();session=r.data.session;if(!session)return login();const p=await db.from('profiles').select('role,username').eq('id',session.user.id).maybeSingle();if(p.error||p.data?.role!=='admin')return denied(p.data?.role);dashboard(p.data)}
function login(){app.innerHTML=`
<div class="login card"><div class="brand">✦ ANIME<b>NOVA</b></div><h1>Panel de administración</h1><p class="muted">Inicia sesión con tu cuenta de administrador.</p><div id="msg"></div><label>Correo electrónico</label><input id="email" type="email" autocomplete="email"><br><br><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"><br><br><button class="btn primary" style="width:100%" onclick="doLogin()">Entrar al panel</button><p class="muted" style="font-size:12px">Si tu cuenta fue la primera creada en AnimeNova, ya tiene el rol de administrador.</p></div>`}
async function doLogin(){const m=document.getElementById('msg');m.innerHTML='Entrando…';const r=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(r.error){m.className='msg error';m.textContent=r.error.message;return}session=r.data.session;boot()}
function denied(role){app.innerHTML=`<div class="login card"><div class="brand">✦ ANIME<b>NOVA</b></div><h1>Acceso restringido</h1><p class="muted">Tu cuenta está autenticada, pero no tiene permisos de administrador.</p><p>Rol actual: <span class="pill">${esc(role||'sin perfil')}</span></p><button class="btn" onclick="db.auth.signOut().then(boot)">Cerrar sesión</button></div>`}
function dashboard(profile){app.innerHTML=`
<div class="wrap"><div class="top"><div><div class="brand">✦ ANIME<b>NOVA</b></div><div class="muted">Centro de control · Hola, ${esc(profile.username||session.user.email)}</div></div><div class="actions"><a class="btn" href="/">Ver sitio</a><button class="btn" onclick="db.auth.signOut().then(boot)">Salir</button></div></div>
<div class="grid"><aside class="side"><button class="tab active" onclick="show('animes',this)">🎌 Anime</button><button class="tab" onclick="show('seasons',this)">📚 Temporadas</button><button class="tab" onclick="show('episodes',this)">▶ Episodios</button></aside><main><section id="animes" class="view"></section><section id="seasons" class="view hidden"></section><section id="episodes" class="view hidden"></section></main></div></div>`;loadAll()}
function show(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='seasons')renderSeasons();if(id==='episodes')renderEpisodes()}
async function loadAll(){let a=await db.from('anime').select('*').order('created_at',{ascending:false});anime=a.data||[];let s=await db.from('seasons').select('*').order('season_number');seasons=s.data||[];let e=await db.from('episodes').select('*').order('episode_number');episodes=e.data||[];renderAnimes();renderSeasons();renderEpisodes()}
function renderAnimes(){document.getElementById('animes').innerHTML=`<div class="card"><h2>Catálogo de anime</h2><p class="muted">Añade la información y publica cuando esté lista.</p><button class="btn primary" onclick="animeForm()">+ Nuevo anime</button></div><div class="list">${anime.map(x=>`<div class="item"><img class="poster" src="${esc(x.poster_url||'')}" onerror="this.style.display='none'"><div class="grow"><b>${esc(x.title)}</b><div class="muted">${esc(x.genre||'Sin género')} · ${x.year||'—'} · <span class="pill">${x.published?'Publicado':'Oculto'}</span></div></div><div class="actions"><button class="btn" onclick="animeForm('${x.id}')">Editar</button><button class="btn danger" onclick="delAnime('${x.id}')">Eliminar</button></div></div>`).join('')}</div>`}
function animeForm(id){const x=anime.find(a=>a.id===id)||{};document.getElementById('animes').innerHTML=`<div class="card"><h2>${id?'Editar':'Nuevo'} anime</h2><div class="row"><div><label>Título *</label><input id="at" value="${esc(x.title)}"></div><div><label>Slug *</label><input id="as" value="${esc(x.slug||'')}"></div></div><br><div class="row"><div><label>Género</label><input id="ag" placeholder="Acción, Fantasía" value="${esc(x.genre)}"></div><div><label>Año</label><input id="ay" type="number" value="${x.year||''}"></div></div><br><label>Descripción</label><textarea id="ad">${esc(x.description)}</textarea><br><div class="row"><div><label>URL de portada</label><input id="ap" placeholder="https://..." value="${esc(x.poster_url)}"></div><div><label>URL de banner</label><input id="ab" placeholder="https://..." value="${esc(x.banner_url)}"></div></div><br><div class="row3"><div><label>Estado</label><select id="ast"><option value="ongoing" ${x.status==='ongoing'?'selected':''}>En emisión</option><option value="completed" ${x.status==='completed'?'selected':''}>Finalizado</option><option value="hiatus" ${x.status==='hiatus'?'selected':''}>Pausa</option></select></div><div><label>Valoración</label><input id="ar" type="number" step=".1" min="0" max="10" value="${x.rating||''}"></div><div class="check"><input id="af" type="checkbox" ${x.featured?'checked':''}> Destacado &nbsp; <input id="apub" type="checkbox" ${x.published!==false?'checked':''}> Publicado</div></div><br><div class="actions"><button class="btn primary" onclick="saveAnime('${id||''}')">Guardar anime</button><button class="btn" onclick="loadAll()">Cancelar</button></div><div id="formmsg"></div></div>`}
async function saveAnime(id){const data={title:at.value.trim(),slug:as.value.trim()||at.value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),genre:ag.value.trim()||null,year:ay.value?+ay.value:null,description:ad.value.trim()||null,poster_url:ap.value.trim()||null,banner_url:ab.value.trim()||null,status:ast.value,rating:ar.value?+ar.value:null,featured:af.checked,published:apub.checked,updated_at:new Date().toISOString()};if(!data.title){formmsg.innerHTML='<div class="msg error">Escribe un título.</div>';return}let r=id?await db.from('anime').update(data).eq('id',id):await db.from('anime').insert(data);if(r.error){formmsg.innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}await loadAll()}
async function delAnime(id){if(!confirm('¿Eliminar este anime y sus episodios?'))return;const ss=seasons.filter(s=>s.anime_id===id);for(const s of ss)await db.from('episodes').delete().eq('season_id',s.id);await db.from('seasons').delete().eq('anime_id',id);const r=await db.from('anime').delete().eq('id',id);if(r.error)alert(r.error.message);loadAll()}
function renderSeasons(){document.getElementById('seasons').innerHTML=`<div class="card"><h2>Temporadas</h2><p class="muted">Primero selecciona el anime.</p><div class="row"><select id="sanime"><option value="">Selecciona anime</option>${anime.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select><input id="stitle" placeholder="Título de temporada (opcional)"></div><br><div class="actions"><input id="snum" type="number" min="1" value="1" style="max-width:130px"><button class="btn primary" onclick="addSeason()">+ Crear temporada</button></div></div><div class="list">${seasons.map(s=>{let a=anime.find(x=>x.id===s.anime_id);return `<div class="item"><div class="grow"><b>${esc(a?.title||'Anime eliminado')}</b><div class="muted">Temporada ${s.season_number} · ${esc(s.title||'')}</div></div><button class="btn danger" onclick="delSeason('${s.id}')">Eliminar</button></div>`}).join('')}</div>`}
async function addSeason(){if(!sanime.value)return alert('Selecciona un anime');const r=await db.from('seasons').insert({anime_id:sanime.value,season_number:+snum.value,title:stitle.value.trim()||null});if(r.error)alert(r.error.message);loadAll()}
async function delSeason(id){if(!confirm('¿Eliminar temporada y episodios?'))return;await db.from('episodes').delete().eq('season_id',id);await db.from('seasons').delete().eq('id',id);loadAll()}
function renderEpisodes(){document.getElementById('episodes').innerHTML=`<div class="card"><h2>Episodios</h2><p class="muted">Aquí solo necesitas pegar la URL del vídeo y la miniatura.</p><div class="row"><div><label>Anime</label><select id="eanime" onchange="fillSeasons()"><option value="">Selecciona anime</option>${anime.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></div><div><label>Temporada</label><select id="eseason"><option value="">Selecciona anime primero</option></select></div></div><br><div class="row3"><div><label>Número *</label><input id="enum" type="number" min="1" value="1"></div><div><label>Título</label><input id="etitle" placeholder="Episodio 1"></div><div><label>Duración (segundos)</label><input id="edur" type="number"></div></div><br><label>URL del vídeo *</label><input id="evideo" placeholder="https://..."><br><br><label>URL de miniatura</label><input id="ethumb" placeholder="https://..."><br><br><label>Descripción</label><textarea id="edesc"></textarea><br><div class="check"><input id="epub" type="checkbox" checked> Publicado</div><br><button class="btn primary" onclick="addEpisode()">+ Guardar episodio</button></div><div class="list">${episodes.map(e=>{let s=seasons.find(x=>x.id===e.season_id),a=anime.find(x=>x.id===s?.anime_id);return `<div class="item"><div class="grow"><b>${esc(a?.title||'')} · E${e.episode_number}</b><div class="muted">${esc(e.title||'Sin título')} · <span class="pill">${e.published?'Publicado':'Oculto'}</span></div></div><button class="btn danger" onclick="delEpisode('${e.id}')">Eliminar</button></div>`}).join('')}</div>`}
function fillSeasons(){const id=eanime.value;eseason.innerHTML='<option value="">Selecciona temporada</option>'+seasons.filter(s=>s.anime_id===id).map(s=>`<option value="${s.id}">Temporada ${s.season_number} ${esc(s.title||'')}</option>`).join('')}
async function addEpisode(){if(!eseason.value||!evideo.value.trim())return alert('Selecciona temporada y agrega la URL del vídeo');const r=await db.from('episodes').insert({season_id:eseason.value,episode_number:+enum.value,title:etitle.value.trim()||null,description:edesc.value.trim()||null,thumbnail_url:ethumb.value.trim()||null,video_url:evideo.value.trim(),duration_seconds:edur.value?+edur.value:null,published:epub.checked});if(r.error)alert(r.error.message);else loadAll()}
async function delEpisode(id){if(!confirm('¿Eliminar episodio?'))return;const r=await db.from('episodes').delete().eq('id',id);if(r.error)alert(r.error.message);loadAll()}
boot();
</script></body></html>
